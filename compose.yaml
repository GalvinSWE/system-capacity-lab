services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: capacity_lab
    ports:
      - "55432:5432"
    volumes:
      - capacity_lab_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d capacity_lab"]
      interval: 2s
      timeout: 2s
      retries: 20

  app-a:
    build: .
    environment:
      INSTANCE_ID: app-a
      DATABASE_URL: postgres://lab:lab@database:5432/capacity_lab
      DB_POOL_SIZE: 20
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  app-b:
    build: .
    environment:
      INSTANCE_ID: app-b
      DATABASE_URL: postgres://lab:lab@database:5432/capacity_lab
      DB_POOL_SIZE: 20
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "4080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  mock-ota:
    build: .
    command: ["node", "src/mock-ota.js"]
    environment:
      PORT: 4100
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4100/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  gateway-a:
    image: nginx:1.27-alpine
    hostname: gateway-a
    volumes:
      - ./gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      load-balancer:
        condition: service_healthy
      mock-ota:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  gateway-b:
    image: nginx:1.27-alpine
    hostname: gateway-b
    volumes:
      - ./gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      load-balancer:
        condition: service_healthy
      mock-ota:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  public-entry:
    image: nginx:1.27-alpine
    ports:
      - "4090:80"
    volumes:
      - ./public-entry.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 2s
      timeout: 1s
      retries: 10

volumes:
  capacity_lab_data:
