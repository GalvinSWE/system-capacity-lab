events {}

http {
  limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=2r/s;
  limit_req_status 429;

  log_format gateway '$request_id $remote_addr "$request" $status '
                     'upstream=$upstream_addr time=$request_time';
  access_log /var/log/nginx/access.log gateway;

  upstream application_entry {
    server load-balancer:80;
  }

  upstream ota_service {
    server mock-ota:4100;
  }

  server {
    listen 80;

    # Public application routes. /api/health becomes /health upstream.
    location /api/ {
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://application_entry/;
      add_header X-Request-ID $request_id always;
      add_header X-API-Gateway capacity-lab always;
      add_header X-Gateway-Instance $hostname always;
    }

    # One public address can route to a completely different backend.
    location /ota/ {
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://ota_service/;
      add_header X-Request-ID $request_id always;
      add_header X-API-Gateway capacity-lab always;
      add_header X-Gateway-Instance $hostname always;
    }

    # Lab-only authentication policy for administrative routes.
    location /admin/ {
      if ($http_x_api_key != "lab-secret") {
        return 401 '{"error":"missing or invalid API key"}\n';
      }

      default_type application/json;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://application_entry/;
      add_header X-Request-ID $request_id always;
      add_header X-API-Gateway capacity-lab always;
      add_header X-Gateway-Instance $hostname always;
    }

    # Separate route to make rate limiting easy to observe.
    location /limited/ {
      limit_req zone=gateway_limit burst=1 nodelay;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://application_entry/;
      add_header X-Request-ID $request_id always;
      add_header X-API-Gateway capacity-lab always;
      add_header X-Gateway-Instance $hostname always;
    }
  }
}
