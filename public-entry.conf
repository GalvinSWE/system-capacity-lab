events {}

http {
  upstream gateway_cluster {
    zone gateway_cluster 64k;
    server gateway-a:80 max_fails=1 fail_timeout=2s;
    server gateway-b:80 max_fails=1 fail_timeout=2s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://gateway_cluster;
      proxy_connect_timeout 500ms;
      proxy_read_timeout 3s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      add_header X-Public-Entry capacity-lab always;
    }
  }
}
